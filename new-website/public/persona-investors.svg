<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Many threads of people and commitments converging into one ordered system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="0.55" stop-color="#E6E9FF"/>
      <stop offset="1" stop-color="#F6EEEA"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5163FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5163FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4A26B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B8FF5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#444CE7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B1E30" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- soft glow blobs -->
  <circle cx="640" cy="120" r="150" fill="#C9CEFF" opacity="0.55" filter="url(#soft)"/>
  <circle cx="140" cy="480" r="170" fill="#F6D8C4" opacity="0.5" filter="url(#soft)"/>
  <circle cx="430" cy="320" r="120" fill="#ADB4FF" opacity="0.35" filter="url(#soft)"/>

  <!-- sweeping light streaks -->
  <path d="M-40 470 C 180 420 300 300 420 300 S 700 360 840 250" stroke="url(#streak)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M-40 530 C 200 500 340 380 470 370 S 720 420 840 330" stroke="url(#streak)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- scattered people nodes (the hundreds of threads) -->
  <g>
    <g transform="translate(120 110)">
      <circle r="26" fill="#fff"/>
      <circle r="26" fill="none" stroke="#C9CEFF" stroke-width="2"/>
      <circle cy="-6" r="8" fill="#8B8FF5"/>
      <path d="M-13 14 a13 9 0 0 1 26 0" fill="#8B8FF5"/>
    </g>
    <g transform="translate(250 70)">
      <circle r="20" fill="#fff"/>
      <circle r="20" fill="none" stroke="#C9CEFF" stroke-width="2"/>
      <circle cy="-5" r="6.5" fill="#A5AAF8"/>
      <path d="M-10 11 a10 7 0 0 1 20 0" fill="#A5AAF8"/>
    </g>
    <g transform="translate(90 260)">
      <circle r="20" fill="#fff"/>
      <circle r="20" fill="none" stroke="#C9CEFF" stroke-width="2"/>
      <circle cy="-5" r="6.5" fill="#A5AAF8"/>
      <path d="M-10 11 a10 7 0 0 1 20 0" fill="#A5AAF8"/>
    </g>
    <g transform="translate(230 200)">
      <circle r="16" fill="#fff"/>
      <circle r="16" fill="none" stroke="#D7DAFF" stroke-width="2"/>
      <circle cy="-4" r="5" fill="#B9BDF9"/>
      <path d="M-8 9 a8 6 0 0 1 16 0" fill="#B9BDF9"/>
    </g>
    <g transform="translate(360 120)">
      <circle r="16" fill="#fff"/>
      <circle r="16" fill="none" stroke="#D7DAFF" stroke-width="2"/>
      <circle cy="-4" r="5" fill="#B9BDF9"/>
      <path d="M-8 9 a8 6 0 0 1 16 0" fill="#B9BDF9"/>
    </g>
    <circle cx="320" cy="250" r="7" fill="#8B8FF5" opacity="0.7"/>
    <circle cx="170" cy="180" r="6" fill="#8B8FF5" opacity="0.55"/>
    <circle cx="420" cy="200" r="6" fill="#8B8FF5" opacity="0.55"/>
    <circle cx="300" cy="160" r="5" fill="#A5AAF8" opacity="0.6"/>
  </g>

  <!-- threads converging into the system card -->
  <g fill="none" stroke="url(#thread)" stroke-width="2.5" opacity="0.75">
    <path d="M140 130 C 320 180 430 300 520 360"/>
    <path d="M262 82 C 400 160 470 280 530 350"/>
    <path d="M105 270 C 280 320 420 350 510 380"/>
    <path d="M243 212 C 380 270 460 330 520 372"/>
    <path d="M372 130 C 450 220 500 300 540 352"/>
  </g>

  <!-- the one system: ordered card stack -->
  <g filter="url(#cardShadow)">
    <rect x="470" y="350" width="250" height="170" rx="20" fill="#fff"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <circle cx="505" cy="388" r="11" fill="#EEEFFF"/>
    <path d="M500 388 l4 4 7 -8" stroke="#444CE7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="528" y="380" width="120" height="9" rx="4.5" fill="#3A3F63"/>
    <rect x="528" y="394" width="74" height="7" rx="3.5" fill="#C9CEFF"/>

    <circle cx="505" cy="432" r="11" fill="#EEEFFF"/>
    <path d="M500 432 l4 4 7 -8" stroke="#444CE7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="528" y="424" width="138" height="9" rx="4.5" fill="#3A3F63"/>
    <rect x="528" y="438" width="92" height="7" rx="3.5" fill="#C9CEFF"/>

    <circle cx="505" cy="476" r="11" fill="#EEEFFF"/>
    <path d="M500 476 l4 4 7 -8" stroke="#444CE7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="528" y="468" width="104" height="9" rx="4.5" fill="#3A3F63"/>
    <rect x="528" y="482" width="64" height="7" rx="3.5" fill="#C9CEFF"/>
  </g>

  <!-- sparkle accent -->
  <path d="M675 285 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#fff" opacity="0.95"/>
  <path d="M712 330 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z" fill="#fff" opacity="0.8"/>
</svg>
