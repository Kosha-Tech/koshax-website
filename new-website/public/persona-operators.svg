<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="An ordered control board of tasks, every item checked and on track">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EEEA"/>
      <stop offset="0.5" stop-color="#EDEAFB"/>
      <stop offset="1" stop-color="#E6E9FF"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4A26B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5163FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5163FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B1E30" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- glow blobs -->
  <circle cx="150" cy="130" r="150" fill="#F6D8C4" opacity="0.55" filter="url(#soft)"/>
  <circle cx="660" cy="460" r="170" fill="#C9CEFF" opacity="0.55" filter="url(#soft)"/>
  <circle cx="420" cy="180" r="110" fill="#ADB4FF" opacity="0.3" filter="url(#soft)"/>

  <!-- orbit rings: the operator's systems, all in motion around one centre -->
  <g fill="none" stroke="#8B8FF5" opacity="0.35">
    <ellipse cx="400" cy="300" rx="290" ry="180" stroke-width="1.5"/>
    <ellipse cx="400" cy="300" rx="220" ry="132" stroke-width="1.5"/>
  </g>
  <!-- nodes riding the rings -->
  <circle cx="400" cy="120" r="9" fill="#444CE7"/>
  <circle cx="668" cy="370" r="7" fill="#8B8FF5"/>
  <circle cx="180" cy="408" r="7" fill="#8B8FF5"/>
  <circle cx="620" cy="226" r="5" fill="#A5AAF8"/>
  <circle cx="186" cy="232" r="5" fill="#A5AAF8"/>

  <!-- light streaks -->
  <path d="M-40 360 C 160 320 280 240 420 250 S 700 320 840 240" stroke="url(#streak)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M-40 420 C 180 400 320 320 480 330 S 740 380 840 320" stroke="url(#streak)" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- the control board -->
  <g filter="url(#cardShadow)">
    <rect x="255" y="180" width="290" height="240" rx="22" fill="#fff"/>
  </g>
  <!-- board header -->
  <rect x="285" y="208" width="96" height="10" rx="5" fill="#3A3F63"/>
  <rect x="285" y="226" width="58" height="7" rx="3.5" fill="#C9CEFF"/>
  <!-- status dot -->
  <circle cx="522" cy="216" r="7" fill="#2BB673"/>

  <!-- task rows: ordered, flagged, done -->
  <g>
    <rect x="283" y="252" width="234" height="42" rx="12" fill="#F4F5FF"/>
    <circle cx="306" cy="273" r="10" fill="#fff"/>
    <path d="M301.5 273 l3.5 3.5 6.5 -7" stroke="#444CE7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="326" y="263" width="118" height="8" rx="4" fill="#3A3F63"/>
    <rect x="326" y="277" width="70" height="6" rx="3" fill="#B9BDF9"/>
    <rect x="462" y="265" width="42" height="16" rx="8" fill="#E4F5EC"/>

    <rect x="283" y="302" width="234" height="42" rx="12" fill="#F4F5FF"/>
    <circle cx="306" cy="323" r="10" fill="#fff"/>
    <path d="M301.5 323 l3.5 3.5 6.5 -7" stroke="#444CE7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="326" y="313" width="134" height="8" rx="4" fill="#3A3F63"/>
    <rect x="326" y="327" width="86" height="6" rx="3" fill="#B9BDF9"/>
    <rect x="462" y="315" width="42" height="16" rx="8" fill="#FBF3DC"/>

    <rect x="283" y="352" width="234" height="42" rx="12" fill="#F4F5FF"/>
    <circle cx="306" cy="373" r="10" fill="#fff"/>
    <path d="M301.5 373 l3.5 3.5 6.5 -7" stroke="#444CE7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="326" y="363" width="104" height="8" rx="4" fill="#3A3F63"/>
    <rect x="326" y="377" width="60" height="6" rx="3" fill="#B9BDF9"/>
    <rect x="462" y="365" width="42" height="16" rx="8" fill="#EEEFFF"/>
  </g>

  <!-- satellite chips feeding the board -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="150" width="120" height="38" rx="19" fill="#fff"/>
    <rect x="568" y="262" width="120" height="38" rx="19" fill="#fff"/>
    <rect x="150" y="430" width="120" height="38" rx="19" fill="#fff"/>
  </g>
  <circle cx="143" cy="169" r="8" fill="#EEEFFF"/>
  <rect x="158" y="164" width="66" height="9" rx="4.5" fill="#8B8FF5"/>
  <circle cx="591" cy="281" r="8" fill="#EEEFFF"/>
  <rect x="606" y="276" width="66" height="9" rx="4.5" fill="#8B8FF5"/>
  <circle cx="173" cy="449" r="8" fill="#EEEFFF"/>
  <rect x="188" y="444" width="66" height="9" rx="4.5" fill="#8B8FF5"/>

  <!-- connectors -->
  <g fill="none" stroke="#8B8FF5" stroke-width="2" opacity="0.6" stroke-dasharray="1 7" stroke-linecap="round">
    <path d="M238 178 C 268 196 280 210 290 224"/>
    <path d="M570 286 C 552 296 540 304 530 312"/>
    <path d="M256 440 C 278 428 290 416 298 402"/>
  </g>

  <!-- sparkle accent -->
  <path d="M600 130 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#fff" opacity="0.95"/>
  <path d="M645 175 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z" fill="#fff" opacity="0.8"/>
</svg>
